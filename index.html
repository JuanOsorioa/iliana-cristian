<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/movil.css" media="screen and (max-width: 725px)">
  <link rel="stylesheet" href="styles/desktop.css" media="screen and (min-width: 726px)">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="icon" type="img/png" href="img/icon.png">
  <title>Iliana & Cristian - ¡Nuestra Boda!</title>
</head>
<body>
  <header>
    <img src="img/nuestra boda.png" alt="nuestra boda" class="nuestra">
    <img src="img/iliana y cristian.png" alt="iliana y cristian" class="iliana-cristian">
    <img src="img/01.png" alt="primer texto" class="portada">
    <img src="img/numeros.png" alt="numeros" class="numeros">
    <img src="img/Sin título-1.png" alt="flores" class="flores">
    <!--reproductor-->
    <div class="player">
 
    <div class="progress-wrap">
      <div class="progress-bar-container" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
      <div class="progress-times">
        <span id="currentTime">0:52</span>
        <span id="totalTime">3:47</span>
      </div>
    </div>
 
    <div class="controls">
 
      <!-- Like -->
      <button class="btn-like" id="btnLike" title="Me gusta">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
                   2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
                   C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5
                   c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </button>
 
      <!-- Prev -->
      <button class="btn-skip" id="btnPrev" title="Anterior">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
        </svg>
      </button>
 
      <!-- Play/Pause -->
      <button class="btn-play" id="btnPlay" title="Pausar">
        <svg id="iconPause" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
        <svg id="iconPlay" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
 
      <!-- Next -->
      <button class="btn-skip" id="btnNext" title="Siguiente">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/>
        </svg>
      </button>
 
      <!-- Volume -->
      <div class="volume-wrap">
        <button class="btn-volume" title="Volumen">
          <svg viewBox="0 0 24 4" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="24" height="4" rx="2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
    <!--fin de reproductor-->
  </header>
  <main>
    <img src="img/recurso 02.png" alt="primera foto" class="imagen-2">
    <img src="img/tercera flor.png" alt="tercera flor" class="flor-3">
    <img src="img/recurso 03.png" alt="segundo texto" class="segundo-texto">
    <img src="img/recurso 04.png" alt="fecha del evento" class="fecha">
    <!--contador-->
    <img src="img/recurso 05.png" alt="imagen del contador" class="imagen-contador">
    <div class="contador-numeros">
        <span class="contador-num" id="dias">00</span>
        <span class="contador-num" id="horas">00</span>
        <span class="contador-num" id="minutos">00</span>
        <span class="contador-num" id="segundos">00</span>
      </div>
    <!--fin de contador-->
    <div class="contenedor-calendario">
      <img src="img/recurso 06_Mesa de trabajo 1.png" alt="calendario" class="calendario">
    </div>
    <img src="img/recurso 07.png" alt="segundas foto" class="imagen-3">
    <div class="imagen-flor">
      <img src="img/recurso 08.png" alt="ubicación y horario" class="ubicacion">
      <img src="img/flor derecha.png" alt="flor derecha" class="flor-derecha">
    </div>
    <a href="https://maps.app.goo.gl/bHCQaiiLS1CTVERB8" target="_blank" class="como-llegar"><img src="img/como llegar.png" alt="boton de como llegar" class="como-llegar"></a>
    <img src="img/ultima foto.jpeg" alt="ultima foto" class="ultima-foto">
  </main>
  <footer>
    <div class ="codigo-de-vestimenta">
      <img src="img/recurso 09.png" alt="texto-p-vestimenta" class="codigo-vestuario">
      <img src="img/recurso 10.png" alt="hombres-mujeres" class="texto-vestuario">
      <img src="img/flor final.png" alt="flor al final" class="flor-final">
    </div>
  </footer>
  <img src="img/c1.png" alt="flor cae 1" class="c1">
  <img src="img/c2.png" alt="flor cae 2" class="c2">
  <img src="img/c3.png" alt="flor cae 3" class="c3">
  <script src="scripts/player.js"></script>
  <script src="scripts/contador.js"></script>
</body>
</html>
